# MongoDB cho chạy local.  Bật:  docker compose up -d   |  Tắt:  docker compose down
# Xóa luôn dữ liệu:              docker compose down -v
services:
  mongo:
    image: mongo:7
    container_name: xhunting-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Giao diện web xem dữ liệu: http://localhost:8081 (tùy chọn, không cần cho server chạy)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: xhunting-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
